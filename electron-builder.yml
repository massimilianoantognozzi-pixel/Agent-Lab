extends: file:lab/packaging/builder-identity.cjs
directories:
  buildResources: build
files:
  - 'out/main/**/*'
  - 'out/preload/**/*'
  - 'out/renderer/**/*'
  - 'package.json'
  - 'LICENSE'
  - '!node_modules/react-icons/**'
  - '!node_modules/mermaid/**'
  - '!node_modules/@mermaid-js/**'
  - '!node_modules/@shikijs/**'
extraResources:
  - from: ./resources/office
    to: office
    filter:
      - 'Dockerfile'
      - '*.py'
  - from: ./resources/icon.png
    to: icon.png
  - from: ./resources/connector
    to: connector
    filter:
      - 'connector.py'
  - from: ./resources/prompts
    to: prompts
    filter:
      - '*.hbs'
  - from: ./resources/skills
    to: skills
    filter:
      - 'agent-creator/**'
      - 'extension-creator/**'
beforePack: lab/packaging/windows-hooks.cjs
afterPack: lab/packaging/windows-hooks.cjs
artifactBuildStarted: lab/packaging/windows-hooks.cjs
win:
  appId: io.github.massimilianoantognozzi-pixel.agentlab
  executableName: Agent-Lab
  publish: null
  icon: resources/icon.png
  extraResources:
    - from: ./lab/packaging/NOTICE-Agent-Lab.txt
      to: NOTICE-Agent-Lab.txt
    - from: ./resources/win
      to: win
      filter:
        - 'probe.exe'
nsis:
  artifactName: Agent-Lab-${version}-setup.${ext}
  shortcutName: Agent-Lab Desktop
  uninstallDisplayName: Agent-Lab
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  target:
    - target: default
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  type: distribution
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
  gatekeeperAssess: false
  notarize: true
  extraResources:
    - from: ./resources/macos
      to: macos
      filter:
        - 'probe'
dmg:
  artifactName: ${name}-${version}-macos-${arch}.${ext}
linux:
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  maintainer: Hotovo
  category: Utility
  extraResources:
    - from: ./resources/linux
      to: linux
      filter:
        - 'probe'
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  compression: 'gz'
npmRebuild: true
